# ===== Apache Pulsar Configuration =====
pulsar:
  # Service URL for Pulsar broker
  service-url: pulsar://localhost:6650
  
  # Admin URL for Pulsar admin operations (optional)
  admin-url: http://localhost:8080
  
  # Namespace configuration
  tenant: public
  namespace: default
  
  # Topic configuration
  topics:
    document-events: persistent://public/default/docuflow-events
  
  # Producer configuration
  producer:
    send-timeout-ms: 30000
    block-if-queue-full: true
    batching-enabled: true
    batching-max-publish-delay-ms: 10
    max-pending-messages: 1000
  
  # Consumer configuration
  consumer:
    subscription-name: docuflow-event-consumer
    subscription-type: Shared
    ack-timeout-ms: 10000
    consumer-name: docuflow-consumer-1
    receive-queue-size: 1000
  
  # Connection settings
  connection:
    operation-timeout-ms: 30000
    connection-timeout-ms: 10000
    io-threads: 10
    listener-threads: 10
    enable-tls: false
    enable-authentication: false

# Logging configuration
logging:
  level:
    org.apache.pulsar: INFO
    com.project.docu.flow.service.pulsar: DEBUG
    com.project.docu.flow: INFO